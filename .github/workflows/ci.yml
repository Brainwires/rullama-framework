name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev libssl-dev pkg-config libdbus-1-dev cmake clang libclang-dev
      - run: cargo check --workspace

  clippy:
    name: Clippy
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev libssl-dev pkg-config libdbus-1-dev cmake clang libclang-dev
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ${{ fromJSON(startsWith(github.event_name, 'pull_request') && '"ubuntu-latest"' || (startsWith(vars.RUNNER_LINUX_X64, '[') && vars.RUNNER_LINUX_X64 || format('"{0}"', vars.RUNNER_LINUX_X64 || 'ubuntu-latest'))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Test
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev libssl-dev pkg-config libdbus-1-dev cmake clang libclang-dev
      - run: cargo test --workspace

  doc:
    name: Documentation
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev libssl-dev pkg-config libdbus-1-dev cmake clang libclang-dev
      - run: cargo doc --workspace --no-deps

  msrv:
    name: MSRV (Rust 1.91)
    # Stays on GitHub-hosted: sudo apt-get install (sudo is inert on the self-hosted pool).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev libssl-dev pkg-config libdbus-1-dev cmake clang libclang-dev
      - name: Check on minimum supported Rust version
        run: cargo check --workspace

  stubs:
    name: No stubs
    runs-on: ${{ fromJSON(startsWith(github.event_name, 'pull_request') && '"ubuntu-latest"' || (startsWith(vars.RUNNER_LINUX_X64, '[') && vars.RUNNER_LINUX_X64 || format('"{0}"', vars.RUNNER_LINUX_X64 || 'ubuntu-latest'))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Fail if todo!/unimplemented!/FIXME stubs exist outside tests
        run: cargo xtask check-stubs crates/ sdks/ servers/ integrations/ examples/

  test-features:
    name: Test (${{ matrix.backend }})
    # Stays on GitHub-hosted: services: containers (no docker on the self-hosted pool).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres-backend
            service: postgres
          - backend: mysql-backend
            service: mysql
          - backend: qdrant-backend
            service: qdrant
          - backend: surrealdb-backend
            service: surrealdb
    services:
      postgres:
        image: ${{ matrix.service == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: ${{ matrix.service == 'mysql' && 'mysql:8' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: ${{ matrix.service == 'qdrant' && 'qdrant/qdrant:latest' || '' }}
        ports: ['6333:6333', '6334:6334']
      # No surrealdb service: GitHub service containers cannot pass the required
      # `start` command, so the container only ever failed to boot. The surrealdb
      # integration tests are `#[ignore]` and skip when no server is reachable;
      # run them locally with `surreal start memory` + `cargo test --features
      # surrealdb-backend -- --ignored`.
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev libssl-dev pkg-config libdbus-1-dev
      - name: Test with ${{ matrix.backend }}
        run: cargo test -p rullama-storage --features ${{ matrix.backend }}

  macos:
    name: macOS check
    # Stays on GitHub-hosted: brew install (no Homebrew on the self-hosted pool).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: brew install protobuf pkg-config
      - run: cargo check --workspace --exclude rullama-hardware

  fallow:
    name: Fallow gate (Deno)
    runs-on: ${{ fromJSON(startsWith(github.event_name, 'pull_request') && '"ubuntu-latest"' || (startsWith(vars.RUNNER_LINUX_X64, '[') && vars.RUNNER_LINUX_X64 || format('"{0}"', vars.RUNNER_LINUX_X64 || 'ubuntu-latest'))) }}
    # The same gate the pre-commit hook runs (.githooks/pre-commit): dead code, complexity
    # and duplication scoped to what this change INTRODUCES (audit gate = new-only), over
    # the Deno tree per fallow.toml. Hard gate from day one — inherited findings on touched
    # files are annotated but do not fail the job.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # audit diffs against the PR base / merge-base
      - uses: fallow-rs/fallow@v3
        with:
          command: audit
          config: fallow.toml
          fail-on-issues: true
          annotations: true
          comment: true

  deno:
    name: Deno
    runs-on: ${{ fromJSON(startsWith(github.event_name, 'pull_request') && '"ubuntu-latest"' || (startsWith(vars.RUNNER_LINUX_X64, '[') && vars.RUNNER_LINUX_X64 || format('"{0}"', vars.RUNNER_LINUX_X64 || 'ubuntu-latest'))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # `deno task check` is the single source of truth for the Deno gate (fmt, lint,
      # type-check, package + integration tests) so local == CI.
      - name: Check (fmt, lint, type-check, tests)
        working-directory: deno
        run: deno task check
