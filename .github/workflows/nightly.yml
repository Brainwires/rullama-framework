name: Nightly integration tests

on:
  schedule:
    # 06:00 UTC — every day.
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  ignored-tests:
    name: Run --ignored tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres-backend
            service: postgres
          - backend: mysql-backend
            service: mysql
          - backend: qdrant-backend
            service: qdrant
          - backend: surrealdb-backend
            service: surrealdb
    services:
      postgres:
        image: ${{ matrix.service == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: ${{ matrix.service == 'mysql' && 'mysql:8' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: ${{ matrix.service == 'qdrant' && 'qdrant/qdrant:latest' || '' }}
        ports: ['6333:6333', '6334:6334']
      # No surrealdb service: GitHub service containers cannot pass the required
      # `start` command (the container just prints usage and exits), so it is
      # started by an explicit step below.
    steps:
      - uses: actions/checkout@v4
      - name: Start SurrealDB
        if: matrix.service == 'surrealdb'
        run: |
          # Pinned to v2.6.5 (matches the `surrealdb = "2"` client crate), by digest.
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:v2.6.5@sha256:d653f6c8a89e81f865ee31cd2f587c50f50ace922175e04150b1e385d2f86011 \
            start --user root --pass root memory
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "SurrealDB is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::SurrealDB did not become healthy within 60s"
          docker logs surrealdb
          exit 1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev libssl-dev pkg-config libdbus-1-dev
      - name: Run --ignored tests with ${{ matrix.backend }}
        env:
          TEST_EMBED_NETWORK: "1"
        run: cargo test -p rullama-storage --features ${{ matrix.backend }} -- --ignored

  embed-network:
    name: Embed-network CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev libssl-dev pkg-config libdbus-1-dev
      - name: Run tests with embedding network access
        env:
          TEST_EMBED_NETWORK: "1"
        run: cargo test -p rullama-cli
