[package]
name = "rullama-audio-ffi"
description = "C ABI over rullama-hardware's local audio: cpal capture, whisper.cpp STT, WebRTC VAD trimming and cpal playback"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[lib]
name = "rullama_audio_ffi"
crate-type = ["cdylib", "rlib"]

[features]
default = ["vad"]
# Trim leading/trailing silence with WebRTC VAD. Without it the crate falls
# back to rullama-hardware's energy VAD.
vad = ["rullama-hardware/vad"]
# Run whisper.cpp on the GPU via Metal (macOS). CPU whisper is the default.
metal = ["whisper-rs/metal"]

[dependencies]
rullama-hardware = { workspace = true, features = ["audio"] }
# Same versions rullama-hardware uses (`audio` / `local-stt`), so the
# workspace resolves a single copy of each.
cpal = "0.15"
whisper-rs = "0.15"
hound = "3.5"

[dev-dependencies]
tempfile = { workspace = true }
